  - name: Update apt cache
    apt:                  
      update_cache: yes                                                                                                                                                                                                                                      
      cache_valid_time: 3600
                                                                                                                                                                                                                                                             
  - name: Install common packages
    apt:                         
      name:
        - curl                                                                                                                                                                                                                                               
        - git 
        - htop                                                                                                                                                                                                                                               
        - vim     
      state: present
                    
  - name: Set timezone to UTC
    timezone:                
      name: UTC
               
  - name: Create app directory                                                                                                                                                                                                                               
    file:                     
      path: /opt/app                                                                                                                                                                                                                                         
      state: directory
      owner: ubuntu   
      group: ubuntu
      mode: "0755" 
                  
  - name: Print environment info                                                                                                                                                                                                                             
    debug:                      
      msg: "Configuring host in {{ env }} environment"

      # run to test the play book: ansible all -i inventories/dev/ -m apt -a "update_cache=yes"
